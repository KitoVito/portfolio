<!doctype html>
<html lang="hr"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Trag svjetla · Fotografski portfolio</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#faf9f6;color:#282923;font:16px Arial,sans-serif}header,main,footer{width:min(92%,1600px);margin:auto}header{height:78px;border-bottom:1px solid #c9c9c1;display:flex;align-items:center;justify-content:space-between}.brand,h1,h2,h3{font-family:Georgia,serif;font-weight:400}.brand{font-size:29px;letter-spacing:-1.6px}header span:last-child,small{font-size:13px;color:#55574e}.intro{display:flex;align-items:baseline;justify-content:space-between;gap:20px;margin:58px 0 32px}h1{font-size:clamp(43px,7vw,108px);letter-spacing:-.065em;line-height:1;margin:0}.filters{display:flex;gap:12px;flex-wrap:wrap}.filters label{font-size:14px;display:grid;gap:6px}select,input{font:inherit;border:1px solid #c6c7be;background:transparent;color:inherit;border-radius:3px;padding:8px}button{font:inherit;color:inherit;cursor:pointer}.grid{display:grid;grid-template-columns:1.18fr .82fr;gap:40px 24px}.card{background:none;text-align:left;border:0;padding:0}.card img{display:block;width:100%;height:clamp(230px,35vw,570px);object-fit:cover;background:#dadcd5}.caption{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding-top:12px}.caption strong{font:normal 25px Georgia,serif}.caption time{font-size:14px}h2{font-size:24px;border-top:1px solid #c9c9c1;padding-top:16px;margin:34px 0 20px}footer{margin-top:64px;padding:22px 0;border-top:1px solid #c9c9c1}dialog{border:0;background:#171914;color:white;width:min(96vw,1200px);padding:18px}dialog::backdrop{background:#10110fe8}dialog img{width:100%;height:70vh;object-fit:contain}dialog div{display:flex;align-items:center;justify-content:space-between;gap:8px}dialog button{background:none;color:white;border:1px solid #81837a;padding:8px}#close{display:block;margin:0 0 8px auto}@media(max-width:850px){.intro{align-items:start;flex-direction:column;margin:34px 0 24px}.grid{grid-template-columns:1fr 1fr}.caption{display:grid}}@media(max-width:600px){header{height:64px}.grid{grid-template-columns:1fr;gap:26px}.card img{height:auto;max-height:70vh}.caption{display:flex}.caption strong{font-size:22px}}

body{background:white}#back,.card{color:inherit;text-decoration:none}#back:hover{text-decoration:underline}
body.album header{border:0}body.album main,body.album header{width:97%}body.album .intro{display:none}
.wall{margin-top:24px;columns:4;column-gap:clamp(8px,1vw,20px)}
.wall button{display:block;width:100%;border:0;background:transparent;padding:0;margin:0 0 clamp(8px,1vw,20px);break-inside:avoid}
.wall img{display:block;width:100%;height:auto}
@media(max-width:900px){.wall{columns:3}}@media(max-width:600px){.wall{columns:2}}
.wall.chronological {
  --row-height: clamp(145px, 17vw, 360px);
  display: flex;
  flex-wrap: wrap;
  columns: auto;
  gap: clamp(8px, 1vw, 20px);
}
.wall.chronological button {
  flex: var(--ratio) 1 calc(var(--ratio) * var(--row-height));
  min-width: 0;
  width: auto;
  margin: 0;
}
.grid{margin-top:24px}
#folders[hidden]{display:none}
</style>
<header><span class="brand">Trag svjetla</span><a id="back" href="#" hidden>Svi albumi</a><span id="subtitle">Fotografski portfolio</span></header>
<main><div id="folders" class="grid"></div><div id="gallery"></div></main>

<dialog aria-label="Povećana fotografija"><button id="close" autofocus>Zatvori ×</button><img id="large" alt=""><div><button id="prev">Prethodna</button><span id="caption"></span><button id="next">Sljedeća</button></div></dialog>
